name = "deep-age-backend"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# Cloudflare Browser Rendering Binding
[browser]
binding = "MYBROWSER"

# Environment Variables
[vars]
NODE_ENV = "production"
PORT = "8787"
# DEMO_URL is optional when running as unified worker (defaults to worker origin)
# DEMO_URL = "http://127.0.0.1:8787"

# KV Namespace (Optional for multi-region run caching)
# [[kv_namespaces]]
# binding = "RUNS_STORE"
# id = "your-kv-id"
